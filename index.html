
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&S Auto Price Calculator</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.05);
padding:25px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.1);
}

h1{
text-align:center;
color:#00aaff;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-weight:bold;
}

select,
input[type="number"]{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.check{
margin-top:15px;
display:flex;
align-items:center;
gap:10px;
}

.result{
margin-top:25px;
padding:20px;
background:rgba(0,170,255,0.15);
border-radius:15px;
text-align:center;
}

.result h2{
color:#00d4ff;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00aaff;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#0095dd;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🧮 AUTO PRICE CALCULATOR</h1>

<label>Print Type</label>
<select id="type">
<option value="bw">Black & White</option>
<option value="color">Colored</option>
</select>

<label>Paper Size</label>
<select id="page">
<option value="short">Short / A4</option>
<option value="long">Long</option>
</select>

<label>Content Type</label>
<select id="content">
<option value="text">Text Only</option>
<option value="mix">Text + Image</option>
<option value="full">Full Image</option>
</select>

<label>PCS</label>
<input type="number" id="pcs" value="1" min="1">

<div class="check">
<input type="checkbox" id="back">
<label for="back">Back-to-back</label>
</div>

<div class="check">
<input type="checkbox" id="rush">
<label for="rush">Rush Print (+₱5)</label>
</div>

<div class="result">
<p>Price Per Page</p>
<h2>₱<span id="price">0</span></h2>

<p>Total Amount</p>
<h2>₱<span id="total">0</span></h2>
</div>

<button onclick="openMessenger()">Order via Messenger</button>
<button onclick="goPricing()">Back to Pricing</button>

</div>
</div>

<script>

const typeEl = document.getElementById("type");
const pageEl = document.getElementById("page");
const contentEl = document.getElementById("content");
const pcsEl = document.getElementById("pcs");
const backEl = document.getElementById("back");
const rushEl = document.getElementById("rush");

const priceEl = document.getElementById("price");
const totalEl = document.getElementById("total");

// PRICING TABLE
const prices = {
  bw: {
    short: { text: 5, mix: 7, full: 10 },
    long:  { text: 6, mix: 8, full: 12 },
    back_fee: 2
  },
  color: {
    short: { text: 7, mix: 15, full: 20 },
    long:  { text: 8, mix: 18, full: 22 },
    back_fee: 3
  },
  rush_fee: 5
};

function calculate(){

  let type = typeEl.value;
  let page = pageEl.value;
  let content = contentEl.value;

  let basePrice = prices[type][page][content];

  if(backEl.checked) basePrice += prices[type].back_fee;
  if(rushEl.checked) basePrice += prices.rush_fee;

  let pcs = parseInt(pcsEl.value) || 1;

  priceEl.innerText = basePrice;
  totalEl.innerText = basePrice * pcs;
}

// AUTO UPDATE
[typeEl, pageEl, contentEl, pcsEl, backEl, rushEl]
.forEach(el => {
  el.addEventListener("change", calculate);
  el.addEventListener("input", calculate);
});

// MESSENGER ORDER
function openMessenger(){

  let typeText = typeEl.value === "bw" ? "Black & White" : "Colored";
  let pageText = pageEl.value === "short" ? "Short / A4" : "Long";
  let contentText =
    contentEl.value === "text" ? "Text Only" :
    contentEl.value === "mix" ? "Text + Image" :
    "Full Image";

  let pcs = parseInt(pcsEl.value) || 1;
  let total = totalEl.innerText;

  let message =
`🧾 A&S STORE ORDER

📌 Print Type: ${typeText}
📄 Paper Size: ${pageText}
🖼️ Content: ${contentText}
📦 PCS: ${pcs}
🔁 Back-to-back: ${backEl.checked ? "Yes" : "No"}
⚡ Rush: ${rushEl.checked ? "Yes" : "No"}

💰 Total: ₱${total}

Please confirm my order.`;

  let url = "https://m.me/asmamburao?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}

function goPricing(){
  window.location.href = "pricing.html";
}

// INIT
calculate();

</script>

</body>
</html>
