<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A&S Auto Price Calculator</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.05);
padding:25px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.1);
}

h1{
text-align:center;
color:#00aaff;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-weight:bold;
}

select,
input[type="number"]{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.check{
margin-top:15px;
display:flex;
align-items:center;
gap:10px;
}

.result{
margin-top:25px;
padding:20px;
background:rgba(0,170,255,0.15);
border-radius:15px;
text-align:center;
}

.result h2{
color:#00d4ff;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00aaff;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#0095dd;
}

</style>
</head>

<body>
  <script>
function calculate() {
  let type = document.getElementById("printType").value;
  let pcs = parseInt(document.getElementById("pcs").value);
  let pages = parseInt(document.getElementById("pages").value);

  let pricePerPage = 0;

  if (type === "xerox_bw") pricePerPage = 2;
  if (type === "xerox_color") pricePerPage = 5;
  if (type === "text_only") pricePerPage = 3;
  if (type === "text_image") pricePerPage = 7;
  if (type === "full_image") pricePerPage = 10;

  let total = pcs * pages * pricePerPage;

  document.getElementById("result").innerText = "Total: ₱" + total;
}
</script>

<div class="container">

<div class="card">

<h1>🧮 AUTO PRICE CALCULATOR</h1>

<label>Print Type</label>
<select id="type">
<option value="bw">Black & White</option>
<option value="color">Colored</option>
</select>

<label>Paper Size</label>
<select id="page">
<option value="short">Short / A4</option>
<option value="long">Long</option>
</select>

<label>Content Type</label>
<select id="content">
<option value="text">Text Only</option>
<option value="mix">Text + Image</option>
<option value="full">Full Image</option>
</select>

<label>PCS</label>
<input type="number" id="pcs" value="1" min="1">

<div class="check">
<input type="checkbox" id="back">
<label for="back">Back-to-back</label>
</div>

<div class="check">
<input type="checkbox" id="rush">
<label for="rush">Rush Print (+₱5)</label>
</div>

<div class="result">

<p>Price Per Page</p>
<h2>₱<span id="price">0</span></h2>

<p>Total Amount</p>
<h2>₱<span id="total">0</span></h2>

</div>

<button onclick="openMessenger()">
Order via Messenger
</button>

<button onclick="goPricing()">
Back to Pricing
</button>

</div>

</div>

<script>

const typeEl = document.getElementById("type");
const pageEl = document.getElementById("page");
const contentEl = document.getElementById("content");
const pcsEl = document.getElementById("pcs");
const backEl = document.getElementById("back");
const rushEl = document.getElementById("rush");

const priceEl = document.getElementById("price");
const totalEl = document.getElementById("total");

// 🧾 CENTRAL PRICING TABLE (EASY TO EDIT)
const prices = {
  bw: {
    short: { text: 5, mix: 7, full: 10 },
    long:  { text: 6, mix: 8, full: 12 },
    back_fee: 2
  },
  color: {
    short: { text: 7, mix: 15, full: 20 },
    long:  { text: 8, mix: 18, full: 22 },
    back_fee: 3
  },
  rush_fee: 5
};

function calculate(){

  let type = typeEl.value;
  let page = pageEl.value;
  let content = contentEl.value;

  let basePrice = prices[type][page][content];

  // back-to-back fee
  if(backEl.checked){
    basePrice += prices[type].back_fee;
  }

  // rush fee
  if(rushEl.checked){
    basePrice += prices.rush_fee;
  }

  let pcs = parseInt(pcsEl.value) || 1;

  priceEl.innerText = basePrice;
  totalEl.innerText = basePrice * pcs;
}

// auto update
[typeEl, pageEl, contentEl, pcsEl, backEl, rushEl]
.forEach(el => {
  el.addEventListener("change", calculate);
  el.addEventListener("input", calculate);
});

<script>
function openMessenger(){

  let type = typeEl.value;
  let page = pageEl.value;
  let content = contentEl.value;
  let pcs = parseInt(pcsEl.value) || 1;

  let typeText = type === "bw" ? "Black & White" : "Colored";
  let pageText = page === "short" ? "Short / A4" : "Long";
  let contentText =
    content === "text" ? "Text Only" :
    content === "mix" ? "Text + Image" :
    "Full Image";

  let back = backEl.checked ? "Yes" : "No";
  let rush = rushEl.checked ? "Yes" : "No";

  let total = totalEl.innerText;

  let message =
`🧾 A&S STORE ORDER

📌 Print Type: ${typeText}
📄 Paper Size: ${pageText}
🖼️ Content: ${contentText}
📦 PCS: ${pcs}
🔁 Back-to-back: ${back}
⚡ Rush: ${rush}

💰 Total Amount: ₱${total}

Please confirm my order. Thank you!`;

  let encoded = encodeURIComponent(message);

  // Messenger link (best working format for pages)
  let url = "https://m.me/asmamburao?text=" + encoded;

  window.open(url, "_blank");
}
</script>
  window.open(
    "https://www.messenger.com/t/asmamburao",
    "_blank"
  );
}

function goPricing(){
  window.location.href = "pricing.html";
}

calculate();

</script>
</body>
</html>
